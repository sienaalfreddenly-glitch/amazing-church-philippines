# Self-hosted stack for the public site.
#
# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# The Supabase containers are NOT defined here. They are managed separately and
# already publish Kong on host port 54321; Caddy proxies to them through
# host.docker.internal. See deploy/README.md.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time. Changing these requires
        # a rebuild, not just a restart.
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_ORIGIN}/supabase
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_FACEBOOK_PAGE_URL: ${FACEBOOK_PAGE_URL}
    environment:
      # Read at runtime by server components and route handlers.
      NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_ORIGIN}/supabase
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      NEXT_PUBLIC_FACEBOOK_PAGE_URL: ${FACEBOOK_PAGE_URL}
      # Server-side traffic goes straight to Supabase instead of out through
      # the tunnel and back in, which is what was 500ing every image.
      SUPABASE_INTERNAL_URL: http://host.docker.internal:54321
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ESV_API_KEY: ${ESV_API_KEY}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    ports:
      # Bound to loopback only. The ngrok container is what exposes this
      # publicly, so the port is not reachable from the local network directly.
      - '127.0.0.1:8091:8091'

  # The public front door. A reserved ngrok domain keeps the same address
  # across reboots, which a random free tunnel does not. Runs as a container so
  # it comes back with everything else rather than needing a terminal open.
  ngrok:
    image: ngrok/ngrok:latest
    depends_on:
      - caddy
    command: ['http', 'caddy:8091', '--domain', '${NGROK_DOMAIN}', '--log', 'stdout']
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
